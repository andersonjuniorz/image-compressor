name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --onefile --windowed --name image-compressor-linux-x86_64 main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-compressor-linux-x86_64
          path: dist/image-compressor-linux-x86_64
          if-no-files-found: error

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --onefile --windowed --name image-compressor-windows-x86_64 main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-compressor-windows-x86_64
          path: dist/image-compressor-windows-x86_64.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/image-compressor-linux-x86_64
            dist/image-compressor-windows-x86_64.exe
          generate_release_notes: true
