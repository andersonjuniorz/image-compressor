[package]
name = "image-compress"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png"] }
imagequant = "4"
jpeg-encoder = "0.6"
jpegxl-rs = "0.11"
jxl-oxide = "0.12"
oxipng = "9"
png = "0.17"
rayon = "1"
walkdir = "2"
webp = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
